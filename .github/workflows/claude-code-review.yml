name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts. A full review runs when the PR is opened or marked ready; each later push
    # gets a short follow-up review of the new commits only (see REVIEW.md).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so follow-up reviews can diff only the newly pushed commits.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these repository secrets: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max
          # subscription, created by `/install-github-app`) or ANTHROPIC_API_KEY (Console API key).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            PREVIOUS HEAD: ${{ github.event.before }}
            NEW HEAD: ${{ github.event.pull_request.head.sha }}

            This is a 2D game built with the Godot engine (GDScript, .tscn/.tres scenes and resources).
            The PR branch is already checked out in the current working directory.

            First read REVIEW.md at the repository root and follow it: focus areas, severity,
            the nit cap, the skip list and the follow-up rules.

            If EVENT is `synchronize`, this is a FOLLOW-UP review:
            - Read your earlier review comments with `gh pr view ${{ github.event.pull_request.number }} --comments`
              and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
            - Review only `git diff PREVIOUS_HEAD NEW_HEAD` (the SHAs above). If PREVIOUS HEAD is
              missing from history (force-push), use the full PR diff but still apply the follow-up rules.
            - Report blocking findings only, and never repeat anything already raised.
            Otherwise (opened, reopened, ready_for_review) review the whole PR with `gh pr diff`.

            Posting:
            - Keep ONE summary comment per PR. Post or update it with
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "..."`.
              On a follow-up, keep the earlier summary and append a short dated "Update" section with the result.
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) only for
              findings on specific lines. Start each with **Blocking** or **Nit**.
            - Only post GitHub comments; don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
